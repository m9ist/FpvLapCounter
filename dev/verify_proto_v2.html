<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Верификация — прототип v2</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #ffffff;
    color: #31333f;
    font-family: "Source Sans Pro", "Segoe UI", sans-serif;
    font-size: 14px;
    padding: 24px;
}
h2 { margin-bottom: 4px; font-size: 1.25rem; }
.hint { color: #808495; margin-bottom: 20px; font-size: 13px; }

.card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 1100px;
}

/* ============================================================
   КАРТОЧКА — фон и рамка на ВСЮ карточку, зависят от статуса.
   Все внутренние элементы имеют ФИКСИРОВАННУЮ высоту,
   поэтому при смене статуса ничего не прыгает.
   ============================================================ */
.card {
    border-radius: 10px;
    border: 3px solid transparent;   /* одинаковая толщина во всех состояниях — нет сдвигов */
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: background-color .15s, border-color .15s;
}
.card[data-state="ok"]   { background: rgba(33, 163, 102, 0.14); }
.card[data-state="bad"]  { background: rgba(224, 67, 85, 0.11); }
.card[data-state="none"] { background: #ffe08a; border-color: #e04355; }

.card-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 6px;
    overflow: hidden;
    background: #000;
}
.card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Одна строка меты фиксированной высоты: номер, время, сходство */
.card-meta {
    height: 20px;
    line-height: 20px;
    font-size: 13px;
    color: #55596a;
    display: flex;
    justify-content: space-between;
    white-space: nowrap;
    overflow: hidden;
}
.card-meta b { color: #31333f; }

/* Статус-строка: всегда одна и та же высота во всех трёх состояниях */
.status {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
}
.card[data-state="ok"]   .status { background: rgba(33, 163, 102, 0.18); color: #157347; }
.card[data-state="bad"]  .status { background: rgba(224, 67, 85, 0.16);  color: #c22f40; }
.card[data-state="none"] .status { background: rgba(180, 130, 0, 0.22); color: #7a5800; }

/* Строка кнопок — фиксированная высота */
.btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    height: 36px;
}
button {
    height: 36px;
    border-radius: 6px;
    border: 1px solid #d5dae5;
    background: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background .12s, border-color .12s, box-shadow .12s;
    line-height: 1;
}
button:hover { border-color: #9aa0b0; }

/* Активная кнопка = залита цветом статуса */
.card[data-state="ok"]  .btn-ok  { background: #21a366; border-color: #21a366; color: #fff; }
.card[data-state="bad"] .btn-bad { background: #e04355; border-color: #e04355; color: #fff; }
</style>
</head>
<body>

<h2>Верификация пролётов — прототип v2</h2>
<p class="hint">Кликай ✅ / ❌ — статус переключается, а высота карточки и позиции кнопок
не меняются (повторный клик по активной кнопке сбрасывает в «не проверен»).
Фон — на всю карточку; красная рамка выделяет непроверенные.</p>

const STATUS_LABEL = {
    ok:   "✅ Подтверждён",
    bad:  "❌ Фейк",
    none: "⬜ Не проверен",
};

function stateOf(v) { return v === true ? "ok" : v === false ? "bad" : "none"; }

function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (const c of CARDS) {
        const st = stateOf(c.verified);
        const el = document.createElement("div");
        el.className = "card";
        el.dataset.state = st;
        el.innerHTML = `
            <div class="card-thumb"><img src="${c.img}" alt="frame"></div>
            <div class="card-meta"><span><b>#${c.idx}</b> · ${c.time}</span><span>сходство ${c.sim}</span></div>
            <div class="status">${STATUS_LABEL[st]}</div>
            <div class="btn-row">
                <button class="btn-ok"  title="Подтвердить пролёт">✅</button>
                <button class="btn-bad" title="Отметить как фейк">❌</button>
                <button class="btn-ref" title="Использовать как референс">🎯</button>
            </div>`;
        el.querySelector(".btn-ok").onclick  = () => { c.verified = c.verified === true  ? null : true;  render(); };
        el.querySelector(".btn-bad").onclick = () => { c.verified = c.verified === false ? null : false; render(); };
        grid.appendChild(el);
    }
}
render();
</script>
